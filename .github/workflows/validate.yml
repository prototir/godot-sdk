name: Validate Godot addon

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/test.mjs
      - run: node tools/test-godot-runner.mjs

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The addon is GDScript, so the only thing that can tell us it still compiles and still
      # behaves is Godot itself. The node job above checks structure; this one runs the code.
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          curl -fsSL "$url" -o godot.zip
          unzip -q godot.zip
          chmod +x "$name"
          mv "$name" /usr/local/bin/godot

      # A first headless open imports the project. Without it the very first --script run races
      # the import and fails on resources that do not exist yet.
      - name: Import project
        run: node tools/run-godot.mjs --headless --path . --import

      # Standalone --check-only/--script replaces the project main loop, so scripts that use
      # the Prototir autoload fail there. Load every script in a normal project scene instead.
      - name: Validate every project script
        run: node tools/run-godot.mjs --headless --path . tests/validate_scripts.tscn --quit-after 600

      - name: Run runtime tests
        run: node tools/run-godot.mjs --headless --path . tests/run_tests.tscn --quit-after 600

      # --check-only cannot see autoloads, so it reports `Prototir` as undefined in every
      # example. Running the scene is what actually proves one still works: the script compiles,
      # the UI builds, and the signals it connects to still exist with those names.
      - name: Smoke-run the examples
        run: |
          set -euo pipefail
          for scene in examples/*/*.tscn; do
            echo "running $scene"
            node tools/run-godot.mjs --headless --path . "$scene" --quit-after 120
          done
